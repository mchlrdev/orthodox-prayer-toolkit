name: Rust

on:
  push:
    branches: [rewrite/gpui]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/core/**"
      - "scripts/core-golden/**"
      - "scripts/core-golden.sh"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # GPUI links against X11/Wayland/xkbcommon/Vulkan on Linux.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build app
        run: cargo build -p prayer-ui --locked

  # While the TypeScript core exists it is the reference: its outputs must
  # match the committed goldens the Rust tests check against.
  core-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regenerate goldens
        run: scripts/core-golden.sh

      - name: Goldens unchanged
        run: |
          changes=$(git status --porcelain -- crates/prayer-core/tests/golden)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- crates/prayer-core/tests/golden | head -200
            exit 1
          fi
