name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # App typecheck resolves @orthodox-prayer-toolkit/core via packages/core/dist.
      - name: Build core
        run: pnpm --filter @orthodox-prayer-toolkit/core build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build Electron bundles
        shell: bash
        run: pnpm --filter @orthodox-prayer-toolkit/app build:electron
        env:
          # Avoid interactive Electron download prompts in CI.
          ELECTRON_GET_USE_PROXY: "0"
