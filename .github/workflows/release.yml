name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Build per OS without publishing (avoids GitHub Release create races),
# then one job uploads all installers + latest*.yml to the tag release.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            eb_args: --mac
            artifact: mac
          - os: windows-latest
            eb_args: --win
            artifact: win
          - os: ubuntu-latest
            eb_args: --linux
            artifact: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Core + App renderer/main
        run: |
          pnpm --filter @orthodox-prayer-toolkit/core build
          pnpm --filter @orthodox-prayer-toolkit/app build:electron

      - name: Package (no publish)
        working-directory: packages/app
        env:
          # Never export empty CSC_LINK — electron-builder treats "" as a file path.
          CSC_LINK: ${{ (matrix.artifact == 'mac' && (secrets.MAC_CSC_LINK || secrets.CSC_LINK)) || (matrix.artifact == 'win' && (secrets.WIN_CSC_LINK || secrets.CSC_LINK)) || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.artifact == 'mac' && (secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD)) || (matrix.artifact == 'win' && (secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD)) || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          fi
          if [ -z "${APPLE_API_KEY}" ]; then
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
          fi
          pnpm exec electron-builder --config electron-builder.yml ${{ matrix.eb_args }} --publish never

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.exe
            packages/app/release/*.AppImage
            packages/app/release/*.blockmap
            packages/app/release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publish whatever platforms succeeded (partial matrix OK).
    if: always() && needs.build.result != 'cancelled'

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List files
        run: find dist -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
