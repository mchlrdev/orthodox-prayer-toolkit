<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c1e1e" />
    <meta name="application-name" content="Orthodox Prayer Toolkit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OPT" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Orthodox Prayer Toolkit</title>
    <script>
      (function () {
        try {
          // Keep in sync with APPEARANCE_STORAGE_KEY in appearancePrefs.ts
          var raw = localStorage.getItem(
            "orthodox-prayer-toolkit.appearance-prefs",
          );
          var scheme = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (
              parsed &&
              (parsed.colorScheme === "light" ||
                parsed.colorScheme === "dark" ||
                parsed.colorScheme === "system")
            ) {
              scheme = parsed.colorScheme;
            }
          }
          var dark =
            scheme === "dark" ||
            (scheme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-mantine-color-scheme",
            dark ? "dark" : "light",
          );
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
