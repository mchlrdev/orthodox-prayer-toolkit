appId: org.orthodox.prayer-toolkit
productName: Orthodox Prayer Toolkit
copyright: Copyright © Orthodox Prayer Toolkit contributors

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true

# electron-updater reads these from GitHub Releases (latest*.yml).
publish:
  provider: github
  releaseType: release

afterSign: scripts/notarize.cjs

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orthodox Prayer Toolkit

linux:
  icon: resources/icon.png
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
